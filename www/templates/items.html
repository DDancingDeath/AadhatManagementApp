<div id="items" class="tab">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px;">
            <h2 style="margin: 0;">Items</h2>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="quick-add-btn-inline" onclick="window.app.items.exportExcel()">📊 Export Excel</button>
            </div>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="itemsViewTable" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f5f5f5; border-bottom: 2px solid #ddd;">
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Item Name</th>
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Purchase Rates (₹/kg)</th>
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Sale Rates (₹/kg)</th>
                    </tr>
                </thead>
                <tbody id="itemsViewTableBody">
                </tbody>
            </table>
        </div>
    </div>
