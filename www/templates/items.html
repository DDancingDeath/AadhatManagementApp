<div id="items" class="tab">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px;">
            <h2 style="margin: 0;"></h2>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="quick-add-btn-inline" onclick="window.app.items.exportExcel()">📊 Export</button>
                <button class="quick-add-btn-inline" onclick="document.getElementById('importItemsFile').click()">📥 Import</button>
                <button class="quick-add-btn-inline" onclick="window.app.items.openAddModal()">➕ Add Item</button>
            </div>
        </div>
        
        <input type="file" id="importItemsFile" accept=".xlsx,.xls,.csv" style="display: none;" onchange="window.app.items.importExcel(event)" />
        
        <div style="margin-bottom: 16px;">
            <input type="text" 
                   id="itemsSearchInput" 
                   placeholder="🔍 Search items by name..."
                   style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;"
                   oninput="window.app.items.search(this.value)">
        </div>
        
        <div style="overflow-x: auto;">
            <table id="itemsViewTable" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f5f5f5; border-bottom: 2px solid #ddd;">
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Item Name</th>
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Purchase Rates (₹/kg)</th>
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Wholesale Rates (₹/kg)</th>
                        <th style="padding: 12px; text-align: left; font-weight: 600;">Retail Sale Rates (₹/kg)</th>
                    </tr>
                </thead>
                <tbody id="itemsViewTableBody">
                </tbody>
            </table>
        </div>
    </div>
