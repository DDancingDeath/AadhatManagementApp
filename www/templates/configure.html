<div id="configure" class="tab">
        <h2>Configure</h2>

        <!-- Sub-tabs for Configure -->
        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn active" onclick="window.app.configure.showSubTab('items')" data-tab="items">
                📦 Items
            </button>
            <button class="filter-btn" onclick="window.app.configure.showSubTab('others')" data-tab="others">
                🔧 Others
            </button>
        </div>

        <!-- Items Sub-tab (Manage) -->
        <div id="configureItemsSubTab" class="sub-tab-content" style="display: block;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px;">
                <h3 style="margin: 0;">Manage Items</h3>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="quick-add-btn-inline" onclick="window.app.items.exportExcel()">📊 Export Excel</button>
                    <button class="quick-add-btn-inline" onclick="document.getElementById('importItemsFile').click()">📥 Import Excel</button>
                </div>
            </div>
            <input type="file" id="importItemsFile" accept=".xlsx,.xls,.csv" style="display: none;" onchange="window.app.items.importExcel(event)" />
            
            <div id="itemsList"></div>

            <button class="add-item-btn" onclick="window.app.items.add()">+ Add Item</button>
        </div>

        <!-- Others Sub-tab -->
        <div id="configureOthersSubTab" class="sub-tab-content" style="display: none;">
            <div class="settings-card">
                <h3>Labor Charges</h3>
                
                <label>Heavy Packet Weight Threshold (kg):</label>
                <input type="number" inputmode="decimal" id="settingHeavyWeight" placeholder="30" value="30" onchange="window.app.settings.save()" />
                <p class="setting-description">Packets above this weight will incur labor charges</p>

                <label>Labor Charge per Heavy Packet (₹):</label>
                <input type="number" inputmode="decimal" id="settingLaborRate" placeholder="6" value="6" onchange="window.app.settings.save()" />
                <p class="setting-description">Amount charged for each heavy packet</p>

                <label class="checkbox-label">
                    <input type="checkbox" id="settingAutoLabor" checked onchange="window.app.settings.save()">
                    <span>Enable automatic labor charges by default</span>
                </label>
            </div>
        </div>
    </div>
