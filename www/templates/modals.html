<!-- Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-header">
                <h3 id="modalTitle">Alert</h3>
            </div>
            <div class="modal-body" id="modalBody">
                <p id="modalMessage">This is a message</p>
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="modal-btn modal-btn-cancel" id="modalCancel" onclick="window.app.ui.closeModal(false)">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm" onclick="window.app.ui.closeModal(true)">OK</button>
            </div>
        </div>
    </div>

    <!-- BILL DETAILS OVERLAY -->
    <div class="bill-details-overlay" id="billDetailsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-content" id="billDetailsContent">
                <!-- Bill content will be inserted here -->
            </div>
            <div class="bill-details-footer">
                <button class="bill-action-btn btn-delete" id="billDeleteBtn" onclick="window.app.history.confirmDeleteBill(window.currentBillIndex)">Delete</button>
                <button class="bill-action-btn btn-edit" id="billEditBtn" onclick="window.app.history.editBillDetails(window.currentBillIndex)">Edit</button>
                <button class="bill-action-btn btn-close" onclick="window.app.history.closeBillDetails()">Close</button>
            </div>
        </div>
    </div>

    <!-- DRAFTS OVERLAY -->
    <div class="bill-details-overlay" id="draftsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-header">
                <h2>Saved Drafts</h2>
                <button class="bill-details-close" onclick="window.app.billing.closeDrafts()">✕</button>
            </div>
            <div class="bill-details-content" id="draftsContent" style="max-height: 60vh; overflow-y: auto;">
                <!-- Drafts will be inserted here -->
            </div>
        </div>
    </div>

    <!-- ITEM EDIT MODAL -->
    <div class="bill-details-overlay" id="itemEditOverlay" style="display: none;">
        <div class="bill-details-container" style="max-width: 700px;">
            <div class="bill-details-content" style="padding: 24px;">
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; display: block;">Item Name (English)*</label>
                    <input type="text" id="itemModalName" 
                           placeholder="Enter item name"
                           style="width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 15px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; display: block;">हिंदी नाम</label>
                    <input type="text" id="itemModalHindiName" 
                           placeholder="हिंदी नाम (वैकल्पिक)"
                           style="width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 15px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #007bff; margin-bottom: 8px; display: block;">Purchase Rates (₹/kg)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div id="itemModalPurchaseRates" class="rates-container" style="flex: 1;"></div>
                        <button class="add-rate-plus purchase" onclick="window.app.items.addModalRate('purchase')">+</button>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #9333ea; margin-bottom: 8px; display: block;">Wholesale Rates (₹/kg)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div id="itemModalWholesaleRates" class="rates-container" style="flex: 1;"></div>
                        <button class="add-rate-plus wholesale" onclick="window.app.items.addModalRate('wholesale')">+</button>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #28a745; margin-bottom: 8px; display: block;">Retail Sale Rates (₹/kg)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div id="itemModalSaleRates" class="rates-container" style="flex: 1;"></div>
                        <button class="add-rate-plus sale" onclick="window.app.items.addModalRate('sale')">+</button>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; display: block;">Contact Person</label>
                    <input type="text" id="itemModalContactPerson" 
                           placeholder="Enter contact person name (Optional)"
                           style="width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 15px;">
                </div>
            </div>
            <div class="bill-details-footer">
                <button class="bill-action-btn btn-delete" id="itemModalDeleteBtn" onclick="window.app.items.deleteItemFromModal()" style="display: none;">Delete</button>
                <button class="bill-action-btn btn-edit" onclick="window.app.items.saveItemFromModal()">Save</button>
                <button class="bill-action-btn btn-close" onclick="window.app.items.closeItemModal()">Cancel</button>
            </div>
        </div>
    </div>
