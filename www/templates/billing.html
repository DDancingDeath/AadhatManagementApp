<div id="billing" class="tab active">

        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn active" id="purchaseModeBtn" onclick="window.app.billing.switchMode('purchase', event)">Purchase</button>
            <button class="filter-btn" id="saleModeBtn" onclick="window.app.billing.switchMode('sale', event)">Sale</button>
        </div>
        
        <!-- Draft Management -->
        <div style="display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;">
            <button onclick="window.app.billing.saveDraft()" class="draft-btn" style="background: #60a5fa !important; border-color: #60a5fa !important; color: white !important; display: flex; align-items: center; justify-content: center; gap: 6px;">
                Save
            </button>
            <button onclick="window.app.billing.showDrafts()" class="draft-btn" style="background: #4ade80 !important; border-color: #4ade80 !important; color: white !important; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                Drafts (<span id="draftCount">0</span>)
            </button>
            <button onclick="window.app.billing.clearBill()" class="draft-btn" style="background: #f87171 !important; border-color: #f87171 !important; color: white !important; display: flex; align-items: center; justify-content: center;">
                Clear
            </button>
        </div>

        <!-- PURCHASE SECTION -->
        <div id="purchaseSection" style="display: block;">
        <div class="form-row">
            <label style="width: 100px;">Customer:</label>
            <div style="display: flex; gap: 8px; flex: 1; align-items: center;">
                <input type="text" id="customerName" list="customerOptions" placeholder="Enter customer name (Optional)" style="flex: 1;" />
                <button onclick="window.app.billing.pickContact()" style="padding: 8px 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; min-width: 40px; display: flex; align-items: center; justify-content: center;" title="Pick Contact">👤</button>
            </div>
            <datalist id="customerOptions"></datalist>
        </div>

        <div class="bill-totals" style="padding: 16px; margin-bottom: 16px;">
            <div class="form-row">
                <label>Item:</label>
                <select id="billItem" onchange="window.app.billing.loadRates()"></select>
            </div>

            <div class="form-row">
                <label>Rate (₹):</label>
                <input type="number" inputmode="decimal" id="billRate" list="rateOptions" step="any" placeholder="Select or enter rate" />
                <datalist id="rateOptions"></datalist>
            </div>

            <div class="form-row">
                <label>Weight (kg):</label>
                <div style="display: flex; gap: 8px; flex: 1;">
                    <input type="number" inputmode="decimal" id="newWeight" placeholder="Enter weight" style="flex: 1;" onkeypress="if(event.key === 'Enter') { event.preventDefault(); window.app.billing.addWeight(true); }" />
                    <button class="quick-add-btn-inline" onclick="window.app.billing.addWeight()">Add</button>
                </div>
            </div>

            <div id="weightsDisplay" class="weights-compact"></div>

            <div class="bill-summary">
                <div class="summary-item">
                    <span>Total: <strong><span id="totalWeights">0</span> kg</strong></span>
                </div>
                <div class="summary-item">
                    <span>Packets: <strong><span id="totalPackets">0</span></strong></span>
                </div>
            </div>

            <button class="add-to-bill-btn" onclick="window.app.billing.addToBill()">Add to Bill</button>
        </div>

        <div id="weightBreakdownSection" style="margin: 20px 0;"></div>

        <h3>Bill Items</h3>
        <table id="billTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Rate</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div style="text-align: right; padding: 8px 0; font-size: 14px; color: var(--text-secondary); margin-top: 8px;">
            Total Packets: <strong style="color: var(--dark-color); font-size: 15px;"><span id="totalPacketsInBill">0</span></strong>
        </div>

        <div class="bill-totals">
            <div class="total-row">
                <span>Purchase Total:</span>
                <strong>₹ <span id="billTotal">0</span></strong>
            </div>
            
            <div class="labor-input-row">
                <label class="checkbox-label" style="margin: 0;">
                    <input type="checkbox" id="autoLaborCharge" checked onchange="window.app.billing.updateTotals()">
                    <span>Labor (₹):</span>
                </label>
                <span id="laborCalculation" style="color: #666; font-size: 13px;">6 × 0</span>
                <input type="number" inputmode="decimal" id="manualLaborCharges" value="0" 
                       onchange="this.dataset.manuallySet = 'true'; window.app.billing.updateTotals();" 
                       onfocus="this.dataset.manuallySet = 'true';" 
                       placeholder="0" />
            </div>
            
            <div class="total-row grand-total" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb) !important;">
                <span style="color: #1976d2 !important; font-weight: 600;">Total Payable:</span>
                <strong style="color: #1976d2 !important;">₹ <span id="amountPayable">0</span></strong>
            </div>

            <div class="payment-row">
                <label>Online (₹):</label>
                <input type="checkbox" id="onlineCheckbox" onchange="window.app.billing.fillPayableAmount('online')" />
                <input type="number" inputmode="decimal" id="onlinePayment" oninput="window.app.billing.updatePaymentTotal();" placeholder="0" />
            </div>
            
            <div class="payment-row">
                <label>Cash (₹):</label>
                <input type="checkbox" id="cashCheckbox" onchange="window.app.billing.fillPayableAmount('cash')" />
                <input type="number" inputmode="decimal" id="cashPayment" oninput="window.app.billing.updatePaymentTotal();" placeholder="0" />
            </div>
            
            <div class="payment-row payment-total" style="background: linear-gradient(135deg, #e3f2fd, #bbdefb); color: #1976d2;">
                <span>Total Paid:</span>
                <strong>₹ <span id="totalPayment">0</span></strong>
            </div>
            
            <div class="payment-row">
                <label>Due (₹):</label>
                <input type="checkbox" id="dueCheckbox" onchange="window.app.billing.fillPayableAmount('due')" />
                <input type="number" inputmode="decimal" id="dueAmount" oninput="window.app.billing.updatePaymentTotal();" placeholder="0" />
            </div>
        </div>

        <div class="form-row" style="margin-top: 16px;">
            <label style="width: 100px;">Comments:</label>
            <input type="text" id="billComments" placeholder="GPay name, payment date, notes, etc. (Optional)" />
        </div>

        <!-- Canvas Debug Preview -->
        <div style="margin-top: 20px; text-align: center;">
            <img id="canvasDebugPreview" style="display: none;" alt="Receipt Preview">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button onclick="window.app.billing.shareWhatsApp()" style="flex: 1; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                WhatsApp
            </button>
            <button class="save-btn save-purchase-btn" id="saveBillBtn" onclick="window.app.billing.saveBill()" style="flex: 1; padding: 12px;">Save</button>
            <button class="print-btn print-purchase-btn" id="printBillBtn" onclick="window.app.billing.printBill()" style="flex: 1; padding: 12px;">Print</button>
                </div>
        </div>
        <!-- END PURCHASE SECTION -->

        <!-- SALE SECTION -->
        <div id="saleSection" style="display: none;">
        <div class="form-row">
            <label style="width: 100px;">Customer:</label>
            <div style="display: flex; gap: 8px; flex: 1; align-items: center;">
                <input type="text" id="saleCustomerName" list="saleCustomerOptions" placeholder="Enter customer name (Optional)" style="flex: 1;" />
                <button onclick="window.app.billing.pickSaleContact()" style="padding: 8px 12px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; min-width: 40px; display: flex; align-items: center; justify-content: center;" title="Pick Contact">👤</button>
            </div>
            <datalist id="saleCustomerOptions"></datalist>
        </div>

        <div class="bill-totals" style="padding: 16px; margin-bottom: 16px; border-radius: 12px;">
            <div class="form-row">
                <label>Item:</label>
                <select id="saleItem" onchange="window.app.billing.loadSaleRates()"></select>
            </div>

            <div class="form-row">
                <label>Rate (₹):</label>
                <input type="number" inputmode="decimal" id="saleRate" list="saleRateOptions" step="any" placeholder="Select or enter rate" />
                <datalist id="saleRateOptions"></datalist>
            </div>

            <div class="form-row">
                <label>Weight (kg):</label>
                <div style="display: flex; gap: 8px; flex: 1;">
                    <input type="number" inputmode="decimal" id="saleWeight" placeholder="Enter weight" style="flex: 1;" onkeypress="if(event.key === 'Enter') { event.preventDefault(); window.app.billing.addSaleWeight(); }" />
                    <button class="quick-add-btn-inline" onclick="window.app.billing.addSaleWeight()" style="background: #22c55e; border-color: #22c55e;">Add</button>
                </div>
            </div>

            <div id="saleWeightsDisplay" class="weights-compact"></div>

            <div class="bill-summary">
                <div class="summary-item">
                    <span>Total: <strong><span id="saleRunningTotal">0</span> kg</strong></span>
                </div>
                <div class="summary-item">
                    <span>Packets: <strong><span id="salePacketCount">0</span></strong></span>
                </div>
            </div>

            <button class="add-to-bill-btn" onclick="window.app.billing.addToSalesBill()" style="background: #22c55e;">Add to Bill</button>
        </div>

        <h3>Bill Items</h3>
        
        <!-- Weight Breakdown Section -->
        <div id="saleWeightBreakdownSection" style="margin: 20px 0;"></div>
        
        <table id="saleTable">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Rate</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div style="text-align: right; padding: 8px 0; font-size: 14px; color: var(--text-secondary); margin-top: 8px;">
            Total Packets: <strong style="color: var(--dark-color); font-size: 15px;"><span id="totalSalePacketsInBill">0</span></strong>
        </div>

        <div class="bill-totals">
            <div class="total-row">
                <span>Sale Total:</span>
                <strong style="color: #22c55e;">₹ <span id="saleTotal">0</span></strong>
            </div>
            
            <div class="total-row grand-total">
                <span>Total Receivable:</span>
                <strong>₹ <span id="amountReceivable">0</span></strong>
            </div>

            <div class="payment-row">
                <label>Online (₹):</label>
                <input type="checkbox" id="saleOnlineCheckbox" onchange="window.app.billing.fillReceivableAmount('online')" />
                <input type="number" inputmode="decimal" id="saleOnlinePayment" oninput="window.app.billing.updateSalePaymentTotal();" placeholder="0" />
            </div>
            
            <div class="payment-row">
                <label>Cash (₹):</label>
                <input type="checkbox" id="saleCashCheckbox" onchange="window.app.billing.fillReceivableAmount('cash')" />
                <input type="number" inputmode="decimal" id="saleCashPayment" oninput="window.app.billing.updateSalePaymentTotal();" placeholder="0" />
            </div>
            
            <div class="payment-row payment-total" style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;">
                <span style="color: #22c55e !important; font-weight: 600;">Total Received:</span>
                <strong style="color: #22c55e !important;">₹ <span id="totalReceived">0</span></strong>
            </div>
            
            <div class="payment-row">
                <label>Due (₹):</label>
                <input type="checkbox" id="saleDueCheckbox" onchange="window.app.billing.fillReceivableAmount('due')" />
                <input type="number" inputmode="decimal" id="saleDueAmount" oninput="window.app.billing.updateSalePaymentTotal();" placeholder="0" />
            </div>
        </div>

        <div class="form-row" style="margin-top: 16px;">
            <label style="width: 100px;">Comments:</label>
            <input type="text" id="saleComments" placeholder="GPay name, payment date, notes, etc. (Optional)" />
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button onclick="window.app.billing.shareSaleWhatsApp()" style="flex: 1; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                WhatsApp
            </button>
            <button class="save-btn save-sale-btn" id="saveSaleBtn" onclick="window.app.billing.completeSale()" style="flex: 1; padding: 12px;">Save</button>
            <button class="print-btn print-sale-btn" id="printSaleBtn" onclick="window.app.billing.printSale()" style="flex: 1; padding: 12px;">Print</button>
                </div>
        </div>
        <!-- END SALE SECTION -->

    </div>
