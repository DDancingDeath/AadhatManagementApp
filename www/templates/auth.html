<!-- Authentication Screen -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <h1>🌾 Aadhat Billing</h1>
                <p>Agricultural Purchase & Inventory Management</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="window.app.auth.showTab('login'); return false;">Login</button>
                <button class="auth-tab" onclick="window.app.auth.showTab('register'); return false;">Register</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button class="auth-btn" onclick="window.app.auth.login()">Login</button>
                <p class="auth-link">Forgot password? <a href="#" onclick="window.app.auth.forgotPassword()">Reset it</a></p>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="auth-form hidden">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="registerName" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a password (min 6 characters)" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" autocomplete="new-password">
                </div>
                <button class="auth-btn" onclick="window.app.auth.register()">Create Account</button>
                <p class="auth-link">Already have an account? <a href="#" onclick="window.app.auth.showTab('login'); return false;">Login</a></p>
            </div>
        </div>
    </div>
