<!-- 
============================================================================
RETAIL SALES TEMPLATE - CURRENTLY UNUSED
============================================================================
This template is NOT accessible from the UI (no navigation link exists).
It duplicates the functionality of the Billing tab's Sale mode.
The corresponding retail-sales.js module is also commented out.
Kept commented for future reference or potential reactivation.
============================================================================

<div id="retail-sales" class="tab">
    <button onclick="window.app.retailSales.switchToPurchase()" style="padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
        📦 Switch to Purchase
    </button>

    <div class="form-section" style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
        <div class="form-row" style="margin-bottom: 16px;">
            <label style="width: 100px; font-weight: 600;">Customer:</label>
            <input type="text" id="retailCustomerName" placeholder="Enter customer name" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
            <button onclick="window.app.retailSales.pickContact()" style="padding: 10px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; min-width: 48px;" title="Pick Contact">👤</button>
        </div>
        
        <div style="background: #f0fdf4; border: 2px solid #22c55e; border-radius: 12px; padding: 16px; margin-top: 16px;">
            <div class="form-row" style="margin-bottom: 12px;">
                <label style="width: 80px; font-weight: 600;">Item:</label>
                <select id="retailItem" onchange="window.app.retailSales.loadItemRates()" style="flex: 1; padding: 10px; border: 1px solid #22c55e; border-radius: 8px;"></select>
            </div>
            
            <div class="form-row" style="margin-bottom: 12px;">
                <label style="width: 80px; font-weight: 600;">Rate (₹):</label>
                <input type="number" inputmode="decimal" id="retailRate" list="retailRateOptions" step="any" placeholder="Select or enter rate" style="flex: 1; padding: 10px; border: 1px solid #22c55e; border-radius: 8px;" />
                <datalist id="retailRateOptions"></datalist>
            </div>
            
            <div class="form-row">
                <label style="width: 80px; font-weight: 600;">Weight (kg):</label>
                <input type="number" inputmode="decimal" id="retailWeight" placeholder="Enter weight" style="flex: 1; padding: 10px; border: 1px solid #22c55e; border-radius: 8px;" onkeypress="if(event.key === 'Enter') { event.preventDefault(); window.app.retailSales.addItem(); }" />
                <button onclick="window.app.retailSales.addItem()" style="padding: 10px 24px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; min-width: 80px;">Add</button>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 16px; padding: 12px; background: white; border-radius: 8px;">
                <div><strong>Total:</strong> <span id="retailTotalKg">0.0</span> kg</div>
                <div><strong>Packets:</strong> <span id="retailTotalPackets">0</span></div>
            </div>
            
            <button onclick="window.app.retailSales.addToBill()" style="width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 12px;">Add to Bill</button>
        </div>
    </div>

    <h3 style="color: #22c55e; margin-bottom: 12px;">Bill Items</h3>
    <table id="retailSaleTable" style="width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden;">
        <thead>
            <tr style="background: #f0fdf4;">
                <th style="padding: 12px; text-align: left;">Item</th>
                <th style="padding: 12px; text-align: center;">Rate</th>
                <th style="padding: 12px; text-align: center;">Qty</th>
                <th style="padding: 12px; text-align: right;">Total</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div style="text-align: right; margin-top: 12px; color: #666;">
        <strong>Total Packets:</strong> <span id="retailBillTotalPackets">0</span>
    </div>

    <div style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 20px;">
        <div class="totals-row" style="display: flex; justify-content: space-between; padding: 12px; font-size: 16px;">
            <span><strong>Sale Total:</strong></span>
            <strong style="color: #3b82f6;">₹ <span id="retailSaleTotal">0</span></strong>
        </div>
        
        <div style="background: #d1fae5; padding: 16px; border-radius: 8px; margin: 12px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 600;">
                <span>Total Receivable:</span>
                <span style="color: #22c55e;">₹ <span id="retailAmountReceivable">0</span></span>
            </div>
        </div>
        
        <div class="form-row" style="margin: 12px 0; align-items: center;">
            <label style="width: 120px; font-weight: 600;">Online (₹):</label>
            <input type="checkbox" id="retailOnlineCheckbox" onchange="window.app.retailSales.fillReceivable('online')" style="margin: 0 8px;" />
            <input type="number" inputmode="decimal" id="retailOnlinePayment" oninput="window.app.retailSales.updatePaymentTotal();" placeholder="0" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
        </div>
        
        <div class="form-row" style="margin: 12px 0; align-items: center;">
            <label style="width: 120px; font-weight: 600;">Cash (₹):</label>
            <input type="checkbox" id="retailCashCheckbox" onchange="window.app.retailSales.fillReceivable('cash')" style="margin: 0 8px;" />
            <input type="number" inputmode="decimal" id="retailCashPayment" oninput="window.app.retailSales.updatePaymentTotal();" placeholder="0" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
        </div>
        
        <div style="background: #dbeafe; padding: 16px; border-radius: 8px; margin: 12px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 600;">
                <span>Total Received:</span>
                <span style="color: #3b82f6;">₹ <span id="retailTotalReceived">0</span></span>
            </div>
        </div>
        
        <div class="form-row" style="margin: 12px 0; align-items: center;">
            <label style="width: 120px; font-weight: 600;">Due (₹):</label>
            <input type="checkbox" id="retailDueCheckbox" style="margin: 0 8px;" />
            <input type="number" inputmode="decimal" id="retailDueAmount" placeholder="0" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" readonly />
        </div>
    </div>

    <div class="form-row" style="margin: 20px 0;">
        <label style="width: 100px; font-weight: 600;">Comments:</label>
        <input type="text" id="retailComments" placeholder="GPay name, payment date, notes..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;">
        <button onclick="window.app.retailSales.shareWhatsApp()" style="padding: 14px; background: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span style="font-size: 20px;">📱</span> WhatsApp
        </button>
        <button onclick="window.app.retailSales.saveSale()" style="padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Save</button>
    </div>
    
    <button onclick="window.app.retailSales.printSale()" style="width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 12px;">Print</button>
</div>
-->
