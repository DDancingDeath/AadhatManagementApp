# Checks every PR and every push to main (#16).
# The hosting workflows (firebase-hosting-*.yml) still run Jest before deploying;
# this workflow adds the checks they don't run: lint, check:sw, check:release,
# Firestore rules tests and (on demand) the Playwright E2E suite (#127).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # 03:00 IST nightly (E2E only)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, Jest, release checks
    # A "labeled" event re-runs only the E2E job; skip the rest.
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Service worker asset list
        run: npm run check:sw
      - name: Release metadata
        run: npm run check:release
      - name: Jest
        run: npx jest --ci

  rules:
    name: Firestore rules tests
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        working-directory: rules-tests
        run: npm ci
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
